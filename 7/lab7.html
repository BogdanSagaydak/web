<!doctype html>
<html>
<head>
		<meta charset="utf-8" />
		<title>Lab7</title>
</head>

<body>

<div>
    <h2>Обчислення за масивом чисел</h2>

    <form id="calcForm">
        <label for="numbersInput">Введіть числа (через кому або пробіл):</label>
        <input type="text" id="numbersInput" required>
        <br>
        <button type="submit">Обчислити</button>
    </form>

    <div id="result" style="margin-top: 20px; font-weight: bold;"></div>
</div>

<hr>


<div>
    <h2>Факторіал</h2>

    <form id="factorialForm2">
        <label for="factorialInput2">Введіть ціле невід'ємне число:</label>
        <input type="text" id="factorialInput2" required>
        <br>
        <button type="submit" id="submit2">Обчислити факторіал</button>
    </form>

    <div id="resultFactorial2" style="margin-top: 20px; font-weight: bold;"></div>
</div>

<hr>


<div>
    <h2>Числа Фібоначчі</h2>

    <form id="fibonacciForm3">
        <label for="fibonacciInput3">Введіть порядковий номер (n):</label>
        <input type="text" id="fibonacciInput3" required>
        <br>
        <button type="submit" id="submit3">Обчислити Фібоначчі</button>
    </form>

    <div id="resultFibonacci3" style="margin-top: 20px; font-weight: normal; line-height: 1.5;"></div>
</div>


<script src="script7.js"></script>

</body>
</html>
